name: check Homebrew formula

on:
  workflow_call:
    inputs:
      tap-repository:
        description: Homebrew tap repository in owner/name form.
        required: true
        type: string
      tap-branch:
        description: Tap branch used as the rendering baseline.
        required: false
        type: string
        default: main
      spec-path:
        description: Formula spec path inside the caller repository.
        required: false
        type: string
        default: .github/homebrew/formula.yml
    outputs:
      formula:
        description: Formula name declared by the spec.
        value: ${{ jobs.generate.outputs.formula }}

permissions:
  contents: read

concurrency:
  group: homebrew-check-${{ github.repository }}-${{ inputs.spec-path }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      formula: ${{ steps.formula.outputs.formula }}
      formula-path: ${{ steps.formula.outputs.formula-path }}
      runner-matrix: ${{ steps.formula.outputs.runner-matrix }}
    steps:
      - name: Checkout pinned Homebrew automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: automation
          persist-credentials: false

      - name: Checkout tap baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.tap-repository }}
          ref: ${{ inputs.tap-branch }}
          path: tap
          persist-credentials: false

      - name: Checkout caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Generate Formula
        id: formula
        uses: ./automation/internal/formula
        with:
          tap-path: tap
          source-path: source
          repository: ${{ github.repository }}
          commit: ${{ github.sha }}
          spec-path: ${{ inputs.spec-path }}
          validation-mode: spec

      - name: Upload generated Formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-check-formula-${{ steps.formula.outputs.formula }}
          path: tap/${{ steps.formula.outputs.formula-path }}
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: generate
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.generate.outputs.runner-matrix) }}
    steps:
      - name: Setup Homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@fccef3b26268fc4a788fd7ad7c189f3a105cbf13 # main
        with:
          stable: true

      - name: Checkout pinned Homebrew automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: automation
          persist-credentials: false

      - name: Checkout tap baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.tap-repository }}
          ref: ${{ inputs.tap-branch }}
          path: tap
          persist-credentials: false

      - name: Download generated Formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-check-formula-${{ needs.generate.outputs.formula }}
          path: tap/Formula

      - name: Audit Formula
        env:
          TAP_PATH: tap
          FORMULA: ${{ needs.generate.outputs.formula }}
          VALIDATION_MODE: spec
        run: bash automation/internal/scripts/validate-formula.sh

  homebrew-check:
    if: always()
    needs:
      - generate
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout pinned Homebrew automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: automation
          persist-credentials: false

      - name: Require successful Formula validation
        env:
          GENERATE_RESULT: ${{ needs.generate.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: bash automation/internal/scripts/require-formula-validation.sh
