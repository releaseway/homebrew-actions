name: test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  inputs:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ vars.RELEASEWAY_FORCE_FULL }}
        run: python3 scripts/ci-mode.py

  docs:
    needs: inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
      - run: python3 scripts/check-docs.py

  evidence:
    needs: inputs
    if: needs.inputs.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 test/release-inputs.py
      - run: python3 test/release-reuse.py
      - run: python3 test/ci-contract.py
      - run: python3 test/release-preparation.py
      - run: python3 test/release-evidence.py
      - run: python3 test/evidence-bundle.py
      - run: python3 test/release-set-evidence.py
      - run: python3 test/homebrew-feature-evidence.py

  regression:
    needs: inputs
    if: needs.inputs.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
      - name: Formula generator
        run: python3 test/formula-generator.py
      - name: Workflow contracts
        run: python3 test/workflow-contracts.py
      - name: Platform contracts and Homebrew parsing
        env:
          RELEASEWAY_BREW_CONTRACTS: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: python3 test/platform-contracts.py
      - name: Publish scripts
        run: python3 test/publish-scripts.py
      - name: Formula validation isolation
        run: python3 test/formula-validation.py
      - name: Native validation evidence
        run: python3 test/validation-evidence.py
      - name: Deploy-key arguments
        run: python3 test/setup-deploy-key.py
      - name: Tap maintenance
        run: python3 test/tap-maintenance.py
      - name: Shell syntax
        run: |
          bash -n \
            internal/formula/generate.sh \
            internal/scripts/*.sh \
            scripts/setup-deploy-key.sh
      - name: Ruby syntax
        run: ruby -c internal/formula/render.rb && ruby -c internal/formula/platforms.rb && ruby -c internal/scripts/validate-formula-update.rb && ruby -c internal/scripts/record-formula-validation.rb
      - name: Whitespace
        run: git diff --check

  actionlint:
    needs: inputs
    if: needs.inputs.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  validation:
    name: validation
    if: always()
    needs: [inputs, docs, evidence, regression, actionlint]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          CI_MODE: ${{ needs.inputs.outputs.mode }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-gate.py
