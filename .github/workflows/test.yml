name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.4"
      - name: Formula generator
        run: python3 test/formula-generator.py
      - name: Workflow contracts
        run: python3 test/workflow-contracts.py
      - name: Release evidence regression
        run: python3 test/release-evidence.py
      - name: Publish scripts
        run: python3 test/publish-scripts.py
      - name: Deploy-key arguments
        run: python3 test/setup-deploy-key.py
      - name: Tap maintenance
        run: python3 test/tap-maintenance.py
      - name: Shell syntax
        run: |
          bash -n \
            internal/formula/generate.sh \
            internal/scripts/*.sh \
            scripts/setup-deploy-key.sh
      - name: Ruby syntax
        run: ruby -c internal/formula/render.rb && ruby -c internal/scripts/validate-formula-update.rb
      - name: Whitespace
        run: git diff --check

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
