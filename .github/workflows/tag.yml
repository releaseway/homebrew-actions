name: Verify release tag
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-tag-ci.py
