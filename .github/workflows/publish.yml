name: publish Homebrew formula

on:
  workflow_call:
    inputs:
      commit:
        description: Full 40-character caller source commit SHA.
        required: true
        type: string
      spec-commit:
        description: Full caller SHA containing the Formula spec; defaults to commit.
        required: false
        type: string
        default: ""
      version:
        description: Product version used by Formula rendering.
        required: true
        type: string
      tap-repository:
        description: Destination Homebrew tap repository in owner/name form.
        required: true
        type: string
      tap-branch:
        description: Destination tap branch.
        required: false
        type: string
        default: main
      spec-path:
        description: Formula spec path inside the caller repository.
        required: false
        type: string
        default: .github/homebrew/formula.yml
      allow-downgrade:
        description: Allow an intentional downgrade, same-version source replacement, or incomparable version.
        required: false
        type: boolean
        default: false
    secrets:
      tap_token:
        description: Token with contents write access to the destination tap.
        required: false
      tap_deploy_key:
        description: SSH deploy key with write access to the destination tap.
        required: false
    outputs:
      spec-commit:
        description: Immutable caller commit containing the Formula spec.
        value: ${{ jobs.generate.outputs.spec-commit }}
      revision:
        description: Formula packaging revision.
        value: ${{ jobs.generate.outputs.revision }}
      formula-sha256:
        description: SHA-256 of the natively validated Formula bytes.
        value: ${{ jobs.generate.outputs.formula-sha256 }}
      validated-platforms:
        description: JSON array of successfully validated native platforms.
        value: ${{ jobs.homebrew-check.outputs.validated-platforms }}
      validation-artifact-id:
        description: Aggregate artifact containing the original native receipts.
        value: ${{ jobs.homebrew-check.outputs.validation-artifact-id }}
      formula:
        description: Formula name declared by the spec.
        value: ${{ jobs.generate.outputs.formula }}
      version:
        description: Normalized Formula version.
        value: ${{ jobs.generate.outputs.version }}
      state:
        description: published when the tap changed, otherwise unchanged.
        value: ${{ jobs.publish.outputs.state }}

permissions:
  contents: read

concurrency:
  group: homebrew-publish-${{ inputs.tap-repository }}-${{ github.repository }}-${{ inputs.spec-path }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      credential-mode: ${{ steps.credential.outputs.mode }}
    steps:
      - name: Checkout pinned Homebrew automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: automation
          persist-credentials: false

      - name: Validate immutable publish inputs
        env:
          COMMIT: ${{ inputs.commit }}
          SPEC_COMMIT: ${{ inputs.spec-commit }}
          VERSION: ${{ inputs.version }}
          TAP_REPOSITORY: ${{ inputs.tap-repository }}
          TAP_BRANCH: ${{ inputs.tap-branch }}
          ALLOW_DOWNGRADE: ${{ inputs.allow-downgrade }}
        run: bash automation/internal/scripts/validate-publish-inputs.sh

      - name: Select tap credential
        id: credential
        env:
          TAP_TOKEN: ${{ secrets.tap_token }}
          TAP_DEPLOY_KEY: ${{ secrets.tap_deploy_key }}
        run: bash automation/internal/scripts/select-tap-credential.sh

  generate:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      formula: ${{ steps.formula.outputs.formula }}
      formula-path: ${{ steps.formula.outputs.formula-path }}
      formula-sha256: ${{ steps.digest.outputs.sha256 }}
      runner-matrix: ${{ steps.formula.outputs.runner-matrix }}
      version: ${{ steps.formula.outputs.version }}
      spec-commit: ${{ steps.formula.outputs.spec-commit }}
      revision: ${{ steps.formula.outputs.revision }}
      formula-context: ${{ steps.formula.outputs.formula-context }}
      invocation-id: ${{ steps.invocation.outputs.id }}
      formula-artifact-name: ${{ steps.invocation.outputs.formula-artifact-name }}
      formula-artifact-id: ${{ steps.formula-upload.outputs.artifact-id }}
    steps:
      - name: Checkout pinned Homebrew automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: automation
          persist-credentials: false

      - name: Checkout tap baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.tap-repository }}
          ref: ${{ inputs.tap-branch }}
          path: tap
          persist-credentials: false

      - name: Checkout caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.spec-commit || inputs.commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Generate Formula
        id: formula
        uses: ./automation/internal/formula
        with:
          tap-path: tap
          source-path: source
          repository: ${{ github.repository }}
          commit: ${{ inputs.commit }}
          spec-commit: ${{ inputs.spec-commit }}
          version: ${{ inputs.version }}
          spec-path: ${{ inputs.spec-path }}
          validation-mode: release

      - name: Identify this reusable workflow invocation
        id: invocation
        env:
          FORMULA: ${{ steps.formula.outputs.formula }}
        run: |
          ruby -rsecurerandom -e '
            id = SecureRandom.uuid
            puts "id=#{id}"
            puts "formula-artifact-name=homebrew-publish-formula-#{ENV.fetch("FORMULA")}-#{id}"
          ' >> "$GITHUB_OUTPUT"

      - name: Freeze generated Formula bytes
        id: digest
        env:
          FORMULA_PATH: tap/${{ steps.formula.outputs.formula-path }}
        run: ruby -rdigest -e 'puts "sha256=#{Digest::SHA256.file(ENV.fetch("FORMULA_PATH")).hexdigest}"' >> "$GITHUB_OUTPUT"

      - name: Upload generated Formula
        id: formula-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.invocation.outputs.formula-artifact-name }}
          path: tap/${{ steps.formula.outputs.formula-path }}
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: generate
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.generate.outputs.runner-matrix) }}
    steps:
      - name: Setup Homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # main
        with:
          stable: true

      - name: Checkout pinned Homebrew automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: automation
          persist-credentials: false

      - name: Checkout tap baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.tap-repository }}
          ref: ${{ inputs.tap-branch }}
          path: tap
          persist-credentials: false

      - name: Download generated Formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.generate.outputs.formula-artifact-id }}
          path: tap/Formula

      - name: Verify requested native runtime
        env:
          FORMULA_CONTEXT: ${{ needs.generate.outputs.formula-context }}
          INVOCATION_ID: ${{ needs.generate.outputs.invocation-id }}
          AUTOMATION_REPOSITORY: ${{ job.workflow_repository }}
          AUTOMATION_SHA: ${{ job.workflow_sha }}
          PLATFORM: ${{ matrix.target.platform }}
          REQUESTED_RUNNER: ${{ matrix.target.runner }}
          FORMULA_PATH: tap/${{ needs.generate.outputs.formula-path }}
          NATIVE_RUNTIME: ${{ runner.temp }}/homebrew-native-runtime.json
          NATIVE_RECEIPT: ${{ runner.temp }}/receipt.json
        run: ruby automation/internal/scripts/record-formula-validation.rb --preflight

      - name: Validate Formula
        env:
          TAP_PATH: tap
          FORMULA: ${{ needs.generate.outputs.formula }}
          FORMULA_PATH: tap/${{ needs.generate.outputs.formula-path }}
          FORMULA_SHA256: ${{ needs.generate.outputs.formula-sha256 }}
          VALIDATION_MODE: release
        run: |
          ruby automation/internal/scripts/verify-formula-bytes.rb
          bash automation/internal/scripts/validate-formula.sh

      - name: Record successful native validation
        env:
          FORMULA_CONTEXT: ${{ needs.generate.outputs.formula-context }}
          INVOCATION_ID: ${{ needs.generate.outputs.invocation-id }}
          AUTOMATION_REPOSITORY: ${{ job.workflow_repository }}
          AUTOMATION_SHA: ${{ job.workflow_sha }}
          PLATFORM: ${{ matrix.target.platform }}
          REQUESTED_RUNNER: ${{ matrix.target.runner }}
          FORMULA_PATH: tap/${{ needs.generate.outputs.formula-path }}
          NATIVE_RUNTIME: ${{ runner.temp }}/homebrew-native-runtime.json
          NATIVE_RECEIPT: ${{ runner.temp }}/receipt.json
          VALIDATION_SUCCEEDED: "true"
        run: ruby automation/internal/scripts/record-formula-validation.rb --record

      - name: Upload native receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-native-${{ needs.generate.outputs.invocation-id }}-${{ matrix.target.platform }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          retention-days: 30

  homebrew-check:
    if: always()
    outputs:
      validated-platforms: ${{ steps.aggregate.outputs.validated-platforms }}
      validation-artifact-id: ${{ steps.validation-upload.outputs.artifact-id }}
    needs:
      - generate
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout pinned Homebrew automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: automation
          persist-credentials: false

      - name: Require successful Formula validation
        env:
          GENERATE_RESULT: ${{ needs.generate.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: bash automation/internal/scripts/require-formula-validation.sh

      - name: Download this invocation's native receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: homebrew-native-${{ needs.generate.outputs.invocation-id }}-*
          path: native-receipts

      - name: Require complete current native receipt set
        id: aggregate
        env:
          FORMULA_CONTEXT: ${{ needs.generate.outputs.formula-context }}
          INVOCATION_ID: ${{ needs.generate.outputs.invocation-id }}
          AUTOMATION_REPOSITORY: ${{ job.workflow_repository }}
          AUTOMATION_SHA: ${{ job.workflow_sha }}
        run: |
          python3 automation/internal/scripts/aggregate-formula-validation.py \
            --receipts native-receipts --output homebrew-validation.json

      - name: Upload aggregate with original native receipts
        id: validation-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-validation-${{ needs.generate.outputs.invocation-id }}
          path: homebrew-validation.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs:
      - preflight
      - generate
      - homebrew-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      state: ${{ steps.result.outputs.state }}
    steps:
      - name: Checkout pinned Homebrew automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: automation
          persist-credentials: false

      - name: Checkout destination tap with token
        if: needs.preflight.outputs.credential-mode == 'token'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.tap-repository }}
          ref: ${{ inputs.tap-branch }}
          token: ${{ secrets.tap_token }}
          path: tap
          fetch-depth: 0

      - name: Checkout destination tap with deploy key
        if: needs.preflight.outputs.credential-mode == 'deploy_key'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.tap-repository }}
          ref: ${{ inputs.tap-branch }}
          ssh-key: ${{ secrets.tap_deploy_key }}
          path: tap
          fetch-depth: 0

      - name: Download generated Formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.generate.outputs.formula-artifact-id }}
          path: tap/Formula

      - name: Commit Formula
        id: commit
        working-directory: tap
        env:
          FORMULA_PATH: ${{ needs.generate.outputs.formula-path }}
          FORMULA_SHA256: ${{ needs.generate.outputs.formula-sha256 }}
          FORMULA: ${{ needs.generate.outputs.formula }}
          VERSION: ${{ needs.generate.outputs.version }}
          COMMIT: ${{ inputs.commit }}
          ALLOW_DOWNGRADE: ${{ inputs.allow-downgrade }}
        run: bash ../automation/internal/scripts/commit-formula.sh

      - name: Push Formula
        if: steps.commit.outputs.changed == 'true'
        working-directory: tap
        env:
          TAP_BRANCH: ${{ inputs.tap-branch }}
          FORMULA_PATH: ${{ needs.generate.outputs.formula-path }}
          FORMULA_SHA256: ${{ needs.generate.outputs.formula-sha256 }}
          VERSION: ${{ needs.generate.outputs.version }}
          COMMIT: ${{ inputs.commit }}
          ALLOW_DOWNGRADE: ${{ inputs.allow-downgrade }}
        run: bash ../automation/internal/scripts/push-formula.sh

      - name: Report publish state
        id: result
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            echo "state=published" >> "$GITHUB_OUTPUT"
          else
            echo "state=unchanged" >> "$GITHUB_OUTPUT"
          fi
