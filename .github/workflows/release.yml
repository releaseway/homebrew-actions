name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable SemVer tag to publish.
        required: true
        type: string
      acceptance-runs:
        description: Successful exact-candidate fixture run IDs, comma-separated
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: release
        uses: releaseway/actions/prepare@9feef2fe68e2b5bc8739f3e23877499b0fa32a6c # v0.4.0
        with:
          mode: resolve
          tag: ${{ inputs.tag }}

      - name: Verify required release files
        env:
          TARGET: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail

          for path in \
            .github/workflows/check.yml \
            .github/workflows/publish.yml; do
            git cat-file -e "$TARGET:$path"
          done

      - name: Verify exact-candidate CI and acceptance evidence
        env:
          GH_TOKEN: ${{ secrets.RELEASEWAY_EVIDENCE_TOKEN || github.token }}
          CANDIDATE: ${{ steps.release.outputs.target }}
          ACCEPTANCE_RUNS: ${{ inputs.acceptance-runs }}
        run: |
          python3 scripts/verify-release-evidence.py \
            --repository "$GITHUB_REPOSITORY" \
            --candidate "$CANDIDATE" \
            --acceptance-runs "$ACCEPTANCE_RUNS"

      - name: Publish immutable automation release
        id: publish
        uses: releaseway/actions@9feef2fe68e2b5bc8739f3e23877499b0fa32a6c # v0.4.0
        with:
          tag: ${{ steps.release.outputs.tag }}
          commit: ${{ steps.release.outputs.target }}
          title: ${{ steps.release.outputs.tag }}
          latest: "true"

      - name: Summary
        run: |
          {
            echo "### homebrew-actions ${{ steps.release.outputs.tag }}"
            echo ""
            echo "- state: ${{ steps.publish.outputs.state }}"
            echo "- release: ${{ steps.publish.outputs.release-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
