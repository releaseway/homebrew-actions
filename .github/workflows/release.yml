name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable SemVer tag to publish.
        required: true
        type: string
      acceptance-runs:
        description: Successful exact-candidate fixture run IDs, comma-separated
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be stable SemVer vX.Y.Z: $TAG" >&2
            exit 1
          fi

          git fetch --force origin main "refs/tags/$TAG:refs/tags/$TAG"
          TARGET="$(git rev-parse "$TAG^{commit}")"
          git merge-base --is-ancestor "$TARGET" origin/main

          for path in \
            .github/workflows/check.yml \
            .github/workflows/publish.yml; do
            git cat-file -e "$TAG:$path"
          done

          {
            echo "tag=$TAG"
            echo "target=$TARGET"
          } >> "$GITHUB_OUTPUT"

      - name: Verify exact-candidate CI and acceptance evidence
        env:
          GH_TOKEN: ${{ secrets.RELEASEWAY_EVIDENCE_TOKEN || github.token }}
          CANDIDATE: ${{ steps.release.outputs.target }}
          ACCEPTANCE_RUNS: ${{ inputs.acceptance-runs }}
        run: |
          python3 scripts/verify-release-evidence.py \
            --repository "$GITHUB_REPOSITORY" \
            --candidate "$CANDIDATE" \
            --acceptance-runs "$ACCEPTANCE_RUNS"

      - name: Publish immutable automation release
        id: publish
        uses: releaseway/actions@078be0809c2db65ab44788000e56d0baa1c1c02a # v0.1.3
        with:
          tag: ${{ steps.release.outputs.tag }}
          commit: ${{ steps.release.outputs.target }}
          title: ${{ steps.release.outputs.tag }}
          latest: "true"

      - name: Summary
        run: |
          {
            echo "### homebrew-actions ${{ steps.release.outputs.tag }}"
            echo ""
            echo "- state: ${{ steps.publish.outputs.state }}"
            echo "- release: ${{ steps.publish.outputs.release-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
