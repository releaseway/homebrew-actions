name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable SemVer tag to publish.
        required: true
        type: string
      acceptance-runs:
        description: Successful exact-candidate homebrew-public and revision/platform fixture run IDs, comma-separated
        required: false
        type: string
      force-full:
        description: Require fresh exact-candidate public acceptance.
        type: boolean
        default: false
      baseline-tag:
        description: Optional immutable stable full baseline; defaults to the latest release.
        type: string
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: release
        uses: releaseway/actions/prepare@2abdf26c6f01c1e49da4ba5d85253847fe721fd9 # v0.6.3
        with:
          mode: resolve
          tag: ${{ inputs.tag }}

      - name: Prepare durable release approval
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.RELEASEWAY_EVIDENCE_TOKEN || github.token }}
          CANDIDATE: ${{ steps.release.outputs.target }}
          RELEASE_TAG: ${{ inputs.tag }}
          ACCEPTANCE_RUNS: ${{ inputs.acceptance-runs }}
          FORCE_FULL: ${{ inputs.force-full }}
          BASELINE_TAG: ${{ inputs.baseline-tag }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$FORCE_FULL" = true ]; then extra+=(--force-full); fi
          if [ -n "$BASELINE_TAG" ]; then extra+=(--baseline-tag "$BASELINE_TAG"); fi
          python3 scripts/prepare-release-evidence.py \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --candidate "$CANDIDATE" --acceptance-runs "$ACCEPTANCE_RUNS" \
            "${extra[@]}"

      - name: Verify required release files
        if: steps.evidence.outputs.state == 'prepared'
        env:
          TARGET: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail

          for path in \
            .github/workflows/check.yml \
            .github/workflows/publish.yml; do
            git cat-file -e "$TARGET:$path"
          done

      - name: Publish immutable automation release
        if: steps.evidence.outputs.state == 'prepared'
        id: publish
        uses: releaseway/actions@ffbe66ca35cbd7edcd6a10806228db76b6a84baf # v0.7.0
        with:
          tag: ${{ steps.release.outputs.tag }}
          commit: ${{ steps.release.outputs.target }}
          title: ${{ steps.release.outputs.tag }}
          latest: "true"
          assets: releaseway-evidence.json

      - name: Authenticate published approval asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE: ${{ steps.release.outputs.target }}
        run: python3 scripts/verify-archived-release.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --candidate "$CANDIDATE"

      - name: Summary
        run: |
          {
            echo "### homebrew-actions ${{ steps.release.outputs.tag }}"
            echo ""
            echo "- verification: ${{ steps.evidence.outputs.verification }}"
            echo "- original SHA: ${{ steps.evidence.outputs.original-sha }}"
            echo "- original verification: ${{ steps.evidence.outputs.verified-at }}"
            echo "- current CI: ${{ steps.evidence.outputs.ci-run }}"
            echo "- state: ${{ steps.publish.outputs.state || steps.evidence.outputs.state }}"
            echo "- release: ${{ steps.publish.outputs.release-url || steps.evidence.outputs.release-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
